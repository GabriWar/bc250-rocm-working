# Tuning Tensile para gfx1013 (AMD BC-250 / Cyan Skillfish)
# Gerado a partir do perfil real de Stable Diffusion 1.5 nesta placa.
# Modelado nos configs oficiais rocblas_hgemm_*_asm_full.yaml da navi21,
# com arquitetura e tamanhos corrigidos para RDNA1 / gfx1013 / 20 WGPs.
GlobalParameters:
  MinimumRequiredVersion: 4.9.0
  PrintLevel: 1
  ForceRedoBenchmarkProblems: True
  ForceRedoLibraryLogic: True
  ForceRedoLibraryClient: True
  CMakeBuildType: Release
  NumBenchmarks: 1
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  LibraryPrintDebug: False
  NumElementsToValidate: 128      # VALIDA numericamente cada kernel
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  ShortNames: False
  MergeFiles: True
  KernelTime: False            # BC-250: temporizador da GPU devolve lixo
  PreciseKernelTime: False
  SleepPercent: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
        - LoopTail: [True]
      ForkParameters:
        - WavefrontSize: [32]
        - PrefetchLocalRead: [True]
        - PrefetchGlobalRead: [True]
        - ThreadTile:
          - [  4,  4 ]
        - WorkGroup:
          - [ 16, 16,  1 ]
        - DepthU: [ 16 ]
        - VectorWidth: [2]
        - GlobalSplitU: [1]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]

LibraryLogic:
  ScheduleName: "cyan_skillfish"
  DeviceNames: ["Device 13fe"]
  ArchitectureName: "gfx1013"

LibraryClient:
